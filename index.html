<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校園保衛戰：擊退無禮月球怪獸</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 1200px; margin: 0 auto; background: #000;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000;
            z-index: 50;
        }
        .status-box { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; border: 2px solid #fff; }
        
        #dpad {
            position: absolute; bottom: 30px; right: 30px;
            width: 180px; height: 180px; pointer-events: auto; display: none; z-index: 50;
        }
        .dbtn {
            position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.7);
            border-radius: 10px; font-size: 30px; display: flex; justify-content: center; align-items: center;
            user-select: none; border: 2px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dbtn:active { background: rgba(200,200,200,0.9); transform: scale(0.95); }
        #up { top: 0; left: 60px; } #down { bottom: 0; left: 60px; }
        #left { top: 60px; left: 0; } #right { top: 60px; right: 0; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; z-index: 100;
        }
        .hidden { display: none !important; }
        .panel {
            background: #2c3e50; padding: 40px; border-radius: 20px; max-width: 80%;
            border: 4px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
        }
        h1 { color: #f1c40f; font-size: 40px; margin-top: 0; }
        p { font-size: 24px; line-height: 1.5; }
        button {
            padding: 15px 30px; font-size: 24px; font-weight: bold; cursor: pointer;
            background: #e74c3c; color: white; border: none; border-radius: 10px;
            margin-top: 20px; transition: 0.2s;
        }
        button:hover { background: #c0392b; transform: scale(1.05); }

        #question-panel { text-align: left; background: #34495e; border-color: #3498db; }
        .option-label {
            display: block; background: #ecf0f1; color: #333; padding: 15px 20px;
            margin: 10px 0; border-radius: 10px; font-size: 22px; cursor: pointer;
            border: 3px solid transparent; transition: 0.2s;
        }
        .option-label:hover { background: #bdc3c7; }
        .option-label input { display: none; }
        .option-label.selected { border-color: #3498db; background: #e8f6ff; font-weight: bold; }
        #confirm-btn { background: #2ecc71; width: 100%; margin-top: 20px; }
        #confirm-btn:hover { background: #27ae60; }
        #feedback-text { margin-top: 15px; font-size: 20px; font-weight: bold; color: #f1c40f; text-align: center; white-space: pre-line;}
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    
    <div id="ui-layer" class="hidden">
        <div class="status-box">騎士 HP: <span id="hp-display">❤️❤️❤️❤️❤️</span></div>
        <div class="status-box">剩餘怪獸: <span id="monster-display">10</span> / 已拯救人員: <span id="score-display">0</span></div>
    </div>

    <div id="dpad" class="hidden">
        <div class="dbtn" id="up">⬆️</div>
        <div class="dbtn" id="left">⬅️</div>
        <div class="dbtn" id="right">➡️</div>
        <div class="dbtn" id="down">⬇️</div>
    </div>

    <div id="start-screen" class="overlay">
        <div class="panel">
            <h1>🛡️ 校園保衛戰</h1>
            <p>糟糕了！學校被「無禮月球怪獸」入侵，<br>老師和同學們都很害怕，校園一片混亂！</p>
            <p>勇敢的裝甲騎士，請移動靠近怪獸。<br>觸碰怪獸並選擇正確的社交方式，拯救大家吧！</p>
            <button onclick="startGame()">開始拯救學校</button>
        </div>
    </div>

    <div id="dialog-screen" class="overlay hidden">
        <div class="panel" id="question-panel">
            <h2 id="q-text" style="color: #ecf0f1; margin-top:0;">情境題目載入中...</h2>
            <div id="options-container"></div>
            <div id="feedback-text"></div>
            <button id="confirm-btn" onclick="submitAnswer()">確定提交</button>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="panel">
            <h1 id="end-title">遊戲結束</h1>
            <p id="end-desc"></p>
            <button onclick="location.reload()">重新遊玩</button>
        </div>
    </div>
</div>

<script>
    // --- 聲音引擎 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);

        if(type === 'slash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if(type === 'monsterBite') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if(type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if(type === 'victory') {
            // 勝利歡呼音效
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.4);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        }
    }

    // --- 題庫 (共10題) ---
    const questions = [
        { q: "小息時，同學不小心在走廊撞到你。", options: ["生氣地大力推開他。", "深呼吸，平靜地跟他說：「請小心。」"], answer: 1, feedback: "別人不小心時，平靜表達能避免衝突。" },
        { q: "你看到同學在玩積木，你也想加入他們。", options: ["直接衝過去把積木搶過來玩。", "站在旁邊，有禮貌地問：「我可以和你們一起玩嗎？」", "在旁邊大哭，直到他們把積木給你。"], answer: 1, feedback: "先詢問別人的意願，是加入遊戲的最佳方法。" },
        { q: "上音樂課時，你覺得聲音太吵，讓你覺得很不舒服。", options: ["馬上大聲尖叫，雙手摀住耳朵。", "舉手告訴老師，並拿出「休息卡」請求去安靜區。", "跑出課室躲起來。"], answer: 1, feedback: "用適當的方式告訴老師你的需要，老師一定會幫助你。" },
        { q: "在體育課玩分組遊戲時，你的隊伍輸了。", options: ["說：「這不公平！」然後生氣地坐在地上。", "罵贏的同學作弊。", "深呼吸，跟同學說：「沒關係，我們下次再努力。」"], answer: 2, feedback: "輸了沒關係，享受遊戲過程才是最重要的。" },
        { q: "老師正在跟校長講話，但你有很急的事情想告訴老師。", options: ["安靜地站在老師旁邊等待，或者輕輕舉手讓老師知道。", "一直拉老師的衣服，大叫老師的名字。", "直接插嘴，打斷他們的對話。"], answer: 0, feedback: "耐心等待別人說完話，是尊重別人的好表現。" },
        { q: "你發現坐在你旁邊的同學因為畫畫不漂亮而在哭。", options: ["走過去嘲笑他畫得不好看。", "當作沒看到，繼續做自己的事。", "遞紙巾給他，並輕輕問：「你還好嗎？」"], answer: 2, feedback: "關心同學能讓他們感到溫暖。" },
        { q: "同學帶來了一個你超級喜歡的恐龍玩具。", options: ["趁同學不注意的時候，把玩具放進自己的書包。", "直接從同學手上拿過來玩。", "問同學：「你的恐龍好酷，我可以借看一會兒嗎？」"], answer: 2, feedback: "別人的東西必須先經過同意才能觸碰。" },
        { q: "在小食部排隊買零食時，有人突然插隊排在你前面。", options: ["直接動手打那個插隊的人。", "大聲用粗口罵他。", "平靜地告訴他：「請排隊。」如果他不聽，就告訴當值老師。"], answer: 2, feedback: "用言語表達和尋求大人協助是最安全的方法。" },
        { q: "早上回到學校，校工叔叔笑著跟你說「早晨」。", options: ["看著他，微笑並回答「早晨」。", "假裝沒聽到，低著頭走開。", "跑開並摀住耳朵。"], answer: 0, feedback: "回應別人的問候能建立友好的校園氣氛。" },
        { q: "上視藝課時，你畫錯了一條線，覺得非常生氣和沮喪。", options: ["把整張畫紙撕爛，然後丟在地上。", "大發脾氣，把顏色筆掃跌。", "告訴自己「沒關係」，用膠擦擦掉或者向老師拿新紙重新畫。"], answer: 2, feedback: "每個人都會犯錯，找到解決方法才是最棒的。" }
    ];

    // --- 遊戲引擎設定 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'init'; // init, start, playing, dialog, animating, end
    let hp = 5; let score = 0; let totalMonsters = 10;
    let monsters = []; let currentMonsterIndex = -1; let selectedOptionIndex = -1;
    let frameCount = 0;
    
    // 動畫狀態管理
    let animTimer = 0; let animMax = 45; 
    let animType = ''; 

    const keys = { w:false, a:false, s:false, d:false, ArrowUp:false, ArrowLeft:false, ArrowDown:false, ArrowRight:false };
    const player = { x: 600, y: 500, size: 30, speed: 6, facingRight: true };

    // 學校人員 (NPCs) 設定
    const npcs = [
        {x: 250, y: 380, type: 'teacher'},
        {x: 900, y: 350, type: 'girl'},
        {x: 350, y: 550, type: 'boy'},
        {x: 850, y: 600, type: 'teacher'},
        {x: 750, y: 450, type: 'boy'},
        {x: 450, y: 400, type: 'girl'}
    ];

    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
    const setupDpad = (id, keyName) => {
        const btn = document.getElementById(id);
        const press = (e) => { e.preventDefault(); keys[keyName] = true; };
        const release = (e) => { e.preventDefault(); keys[keyName] = false; };
        btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release); btn.addEventListener('mouseleave', release);
        btn.addEventListener('touchstart', press); btn.addEventListener('touchend', release);
    };
    setupDpad('up', 'ArrowUp'); setupDpad('down', 'ArrowDown'); setupDpad('left', 'ArrowLeft'); setupDpad('right', 'ArrowRight');

    // 初始化背景
    drawSchool(10);
    drawNPCs(true);
    drawKnight(player.x, player.y, player.facingRight);

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        document.getElementById('dpad').classList.remove('hidden');
        
        monsters = [];
        
        // 題目洗牌機制 (確保每隻怪獸題目都不重複)
        let qIndices = Array.from({length: questions.length}, (_, i) => i);
        qIndices.sort(() => Math.random() - 0.5);

        for(let i=0; i<totalMonsters; i++) {
            let mx, my;
            do {
                mx = 160 + Math.random() * 880;
                my = 310 + Math.random() * 380;
            } while (Math.abs(mx - player.x) < 120 && Math.abs(my - player.y) < 120); // 確保不生在玩家頭上

            monsters.push({
                x: mx, y: my, size: 35, active: true, qIndex: qIndices[i] // 派發不重複的題目
            });
        }
        hp = 5; score = 0; updateUI();
        gameState = 'playing'; 
        gameLoop(); 
    }

    function updateUI() {
        // 只負責更新文字顯示，不再處理遊戲結束邏輯，確保不會覆蓋動畫狀態
        document.getElementById('hp-display').innerText = '❤️'.repeat(Math.max(0, hp));
        const remaining = monsters.filter(m => m.active).length;
        document.getElementById('monster-display').innerText = remaining;
        document.getElementById('score-display').innerText = score;
    }

    function endGame(isVictory) {
        gameState = 'end';
        document.getElementById('end-screen').classList.remove('hidden');
        const title = document.getElementById('end-title');
        const desc = document.getElementById('end-desc');
        
        if(isVictory) {
            playSound('victory');
            title.innerText = "🎉 任務完成！"; title.style.color = "#2ecc71";
            desc.innerHTML = "太棒了！你用正確的社交技巧擊退了全部 10 隻怪獸！<br>校園恢復了美麗與寧靜，老師和同學們都在為你歡呼拍掌！👏";
        } else {
            title.innerText = "💔 任務失敗"; title.style.color = "#e74c3c";
            desc.innerHTML = "你的 HP 歸零了... 學校被月球怪獸吞沒了。<br>不要灰心，休息一下，我們再次挑戰！";
        }
    }

    // --- 繪製學校人員 (NPCs) ---
    function drawNPCs(isScared) {
        npcs.forEach(npc => {
            ctx.save(); ctx.translate(npc.x, npc.y);
            
            // 地板陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 5, 15, 5, 0, 0, Math.PI*2); ctx.fill();

            // 頭部
            ctx.fillStyle = '#f1c27d';
            ctx.beginPath(); ctx.arc(0, -30, 12, 0, Math.PI*2); ctx.fill();

            // 頭髮與細節
            if(npc.type === 'teacher') {
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(0, -32, 12, Math.PI, 0); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                ctx.strokeRect(-6, -32, 5, 3); ctx.strokeRect(1, -32, 5, 3); // 眼鏡
            } else if(npc.type === 'girl') {
                ctx.fillStyle = '#8e44ad'; ctx.beginPath(); ctx.arc(0, -32, 12, Math.PI, 0); ctx.fill();
                ctx.fillRect(-14, -30, 6, 15); ctx.fillRect(8, -30, 6, 15); // 孖辮
            } else { 
                ctx.fillStyle = '#d35400'; ctx.beginPath(); ctx.arc(0, -34, 10, Math.PI, 0); ctx.fill(); // 男孩短髮
            }

            // 身體衣服
            if(npc.type === 'teacher') { 
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(-10, -18, 20, 25); 
            } else if(npc.type === 'girl') { 
                ctx.fillStyle = '#e84393'; 
                ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-15, 10); ctx.lineTo(15, 10); ctx.fill(); 
            } else { 
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(-9, -18, 18, 20); // 衣服
                ctx.fillStyle = '#3498db'; ctx.fillRect(-9, 2, 18, 10); // 褲子
            }

            // 表情與手臂動作
            ctx.fillStyle = '#000';
            if(isScared) {
                // 害怕發抖動畫
                ctx.translate((Math.random()-0.5)*3, 0);
                
                // 害怕的眼睛和嘴巴
                ctx.beginPath(); ctx.arc(-4, -30, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -30, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -25, 4, 0, Math.PI, true); ctx.stroke(); 
                
                // 雙手抱頭
                ctx.strokeStyle = '#f1c27d'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-15, -25); ctx.lineTo(-8, -35); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(15, -25); ctx.lineTo(8, -35); ctx.stroke();
            } else {
                // 開心的眼睛和笑臉
                ctx.beginPath(); ctx.arc(-4, -30, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -30, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -26, 4, 0, Math.PI, false); ctx.stroke(); 
                
                // 拍手歡呼動畫
                let clap = Math.sin(frameCount * 0.3) * 5;
                ctx.strokeStyle = '#f1c27d'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-5 + clap, -15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(10, -10); ctx.lineTo(5 - clap, -15); ctx.stroke();
                
                // 開心符號 (撒花效果)
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-15, -40); ctx.lineTo(-20, -45); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(15, -40); ctx.lineTo(20, -45); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, -45); ctx.lineTo(0, -52); ctx.stroke();
            }

            ctx.restore();
        });
    }

    // --- 繪製精美校園場景 ---
    function drawSchool(remaining) {
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, 250);
        ctx.fillStyle = '#7CFC00'; ctx.fillRect(0, 250, canvas.width, canvas.height - 250);

        ctx.fillStyle = '#E6E6FA'; ctx.fillRect(200, 50, 800, 200);
        ctx.fillStyle = '#CD5C5C'; ctx.fillRect(180, 30, 840, 40); 
        
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(600, 100, 30, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(600, 100, 30, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(600, 100); ctx.lineTo(600, 80); ctx.moveTo(600, 100); ctx.lineTo(615, 100); ctx.stroke();

        ctx.fillStyle = '#FFFACD';
        for(let x=250; x<=850; x+=150) {
            if(x===550) continue; 
            ctx.fillRect(x, 100, 60, 50); ctx.fillRect(x, 170, 60, 50);
            ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2;
            ctx.strokeRect(x, 100, 60, 50); ctx.strokeRect(x, 170, 60, 50);
            ctx.beginPath(); ctx.moveTo(x+30, 100); ctx.lineTo(x+30, 150); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+30, 170); ctx.lineTo(x+30, 220); ctx.stroke();
        }
        ctx.fillStyle = '#8B4513'; ctx.fillRect(550, 150, 100, 100);

        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 5;
        ctx.strokeRect(150, 300, 900, 400); 
        ctx.beginPath(); ctx.moveTo(600, 300); ctx.lineTo(600, 700); ctx.stroke(); 
        ctx.beginPath(); ctx.arc(600, 500, 80, 0, Math.PI*2); ctx.stroke(); 

        // 黑暗濾鏡
        if(remaining > 0) {
            ctx.fillStyle = `rgba(10, 10, 30, ${0.05 + remaining * 0.08})`; // 調整了黑暗程度適應10隻怪獸
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    // --- 繪製精美裝甲騎士 ---
    function drawKnight(x, y, facingRight) {
        ctx.save(); ctx.translate(x, y);
        if(!facingRight) ctx.scale(-1, 1);

        ctx.fillStyle = '#2980b9';
        ctx.beginPath(); ctx.moveTo(5, -10); ctx.lineTo(25, -10); ctx.lineTo(25, 15);
        ctx.arcTo(15, 30, 5, 15, 15); ctx.fill();
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(13, -5, 4, 20); ctx.fillRect(7, 3, 16, 4);

        ctx.fillStyle = '#95a5a6'; ctx.fillRect(-15, -10, 30, 35);
        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(-15, 20, 30, 5); 

        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(-10, 25, 8, 15); ctx.fillRect(2, 25, 8, 15);

        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath(); ctx.arc(0, -20, 18, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e74c3c'; 
        ctx.beginPath(); ctx.moveTo(-5, -38); ctx.quadraticCurveTo(-20, -50, -30, -30); ctx.lineTo(-10, -30); ctx.fill();
        ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, -25, 15, 6); ctx.fillRect(0, -17, 12, 4);

        ctx.save();
        if(gameState === 'animating' && animType === 'playerAttack') {
            ctx.translate(-5, 5); ctx.rotate(Math.PI / 4 + (animTimer * 0.1));
        } else {
            ctx.translate(-5, 5); ctx.rotate(Math.PI / 4);
        }
        ctx.fillStyle = '#f1c40f'; ctx.fillRect(-4, -15, 8, 5);
        ctx.fillStyle = '#ecf0f1'; ctx.fillRect(-2, -50, 4, 35); 
        ctx.beginPath(); ctx.moveTo(-2, -50); ctx.lineTo(0, -60); ctx.lineTo(2, -50); ctx.fill(); 
        ctx.restore();

        ctx.restore();
    }

    // --- 繪製怪獸 ---
    function drawMonsters() {
        monsters.forEach(m => {
            if(!m.active) return;
            ctx.save(); ctx.translate(m.x, m.y);
            
            let floatY = Math.sin(Date.now() / 200 + m.x) * 5;
            ctx.translate(0, floatY);

            ctx.fillStyle = '#7f8c8d'; ctx.beginPath(); ctx.arc(0, 0, m.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath(); ctx.arc(-15, -10, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -15, 6, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-10, -5, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -5, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(-10, -5, 2, 0, Math.PI*2); ctx.fill(); 

            ctx.lineWidth = 3; ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.moveTo(-20, -15); ctx.lineTo(-5, -8); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(20, -15); ctx.lineTo(5, -8); ctx.stroke();

            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 10, 18, 0, Math.PI, false); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath();
            ctx.moveTo(-18, 10); ctx.lineTo(-12, 20); ctx.lineTo(-6, 10);
            ctx.lineTo(0, 20); ctx.lineTo(6, 10); ctx.lineTo(12, 20); ctx.lineTo(18, 10); ctx.fill();

            ctx.restore();
        });
    }

    function checkCollisions() {
        for(let i=0; i<monsters.length; i++) {
            let m = monsters[i];
            if(m.active) {
                let dx = player.x - m.x; let dy = player.y - m.y;
                if(Math.sqrt(dx*dx + dy*dy) < player.size + m.size) {
                    triggerQuestion(i); 
                    break;
                }
            }
        }
    }

    function triggerQuestion(index) {
        gameState = 'dialog';
        currentMonsterIndex = index; selectedOptionIndex = -1;
        player.facingRight = (monsters[index].x > player.x);
        player.x += player.facingRight ? -10 : 10;

        const qData = questions[monsters[index].qIndex];
        document.getElementById('dialog-screen').classList.remove('hidden');
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById('feedback-text').innerText = '';
        document.getElementById('confirm-btn').style.display = 'block';
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        qData.options.forEach((opt, i) => {
            const label = document.createElement('label'); label.className = 'option-label';
            label.innerHTML = `<input type="radio" name="social-opt" value="${i}"> ${opt}`;
            label.onclick = () => {
                document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                label.classList.add('selected'); selectedOptionIndex = i;
            };
            container.appendChild(label);
        });
    }

    function submitAnswer() {
        if(selectedOptionIndex === -1) { alert("請先選擇一個選項！"); return; }
        const qData = questions[monsters[currentMonsterIndex].qIndex];
        const btn = document.getElementById('confirm-btn');
        const feedback = document.getElementById('feedback-text');
        btn.style.display = 'none';

        if(selectedOptionIndex === qData.answer) {
            playSound('correct');
            feedback.style.color = '#2ecc71'; feedback.innerText = "✅ " + qData.feedback;
            animType = 'playerAttack';
        } else {
            feedback.style.color = '#e74c3c'; feedback.innerText = "❌ 哎呀！怪獸趁機攻擊了！\n" + qData.feedback;
            animType = 'monsterAttack';
        }

        setTimeout(() => {
            document.getElementById('dialog-screen').classList.add('hidden');
            startAnimation(); 
        }, 2500);
    }

    function startAnimation() {
        gameState = 'animating';
        animTimer = 0;
        if(animType === 'playerAttack') playSound('slash');
        else if(animType === 'monsterAttack') playSound('monsterBite');
    }

    function drawCombatAnimation() {
        const target = monsters[currentMonsterIndex];
        
        if(animType === 'playerAttack') {
            ctx.save();
            ctx.translate(target.x, target.y);
            let radius = animTimer * 2.5; 
            ctx.strokeStyle = `rgba(241, 196, 15, ${1 - animTimer/animMax})`; 
            ctx.lineWidth = 20;
            ctx.beginPath(); ctx.arc(0, 0, radius, -Math.PI/2, Math.PI/2); ctx.stroke();
            ctx.restore();
        } else if(animType === 'monsterAttack') {
            ctx.fillStyle = `rgba(231, 76, 60, ${0.4 * Math.sin(animTimer/3)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = `rgba(192, 57, 43, ${1 - animTimer/animMax})`;
            ctx.lineWidth = 15; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(player.x - 40 + animTimer*2, player.y - 40 + animTimer*2);
            ctx.lineTo(player.x + 20 + animTimer*2, player.y + 20 + animTimer*2);
            ctx.moveTo(player.x - 20 + animTimer*2, player.y - 40 + animTimer*2);
            ctx.lineTo(player.x + 40 + animTimer*2, player.y + 20 + animTimer*2);
            ctx.stroke();
        }

        animTimer++;
        if(animTimer >= animMax) {
            if(animType === 'playerAttack') {
                target.active = false; score++;
            } else {
                hp--; 
                target.x += (player.facingRight ? 80 : -80); 
            }
            
            updateUI(); 

            // 在動畫徹底結束時，才判斷並觸發結算畫面！
            const remaining = monsters.filter(m => m.active).length;
            if (remaining === 0) {
                endGame(true);
            } else if (hp <= 0) {
                endGame(false);
            } else {
                gameState = 'playing';
            }
        }
    }

    function gameLoop() {
        frameCount++;
        let shakeX = 0, shakeY = 0;
        
        if(gameState === 'animating' && animType === 'monsterAttack') {
            shakeX = (Math.random() - 0.5) * 20; shakeY = (Math.random() - 0.5) * 20;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const remaining = monsters.filter(m => m.active).length;
        drawSchool(remaining);
        
        // 判斷是否所有怪獸都被消滅了？如果是，NPC就會歡呼！
        drawNPCs(remaining > 0);
        
        drawMonsters();
        drawKnight(player.x, player.y, player.facingRight);
        
        if(gameState === 'animating') drawCombatAnimation();

        ctx.restore();

        if(gameState === 'playing') {
            if(keys.w || keys.ArrowUp) player.y -= player.speed;
            if(keys.s || keys.ArrowDown) player.y += player.speed;
            if(keys.a || keys.ArrowLeft) { player.x -= player.speed; player.facingRight = false; }
            if(keys.d || keys.ArrowRight) { player.x += player.speed; player.facingRight = true; }
            
            player.x = Math.max(160, Math.min(1040, player.x));
            player.y = Math.max(310, Math.min(690, player.y));
            
            checkCollisions();
        }

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
